<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Bus Booking</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(
-45deg,
#0f172a,
#1e3a8a,
#0ea5e9,
#6366f1,
#0f172a);

background-size:400% 400%;
animation:bg 15s infinite;
overflow:hidden;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.circle{

position:absolute;
border-radius:50%;
filter:blur(120px);
opacity:.35;

}

.c1{

width:250px;
height:250px;
background:#00d9ff;
top:5%;
left:5%;

}

.c2{

width:250px;
height:250px;
background:#7c3aed;
right:10%;
bottom:5%;

}

.login-box{

width:420px;

padding:40px;

border-radius:25px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(18px);

box-shadow:0 20px 50px rgba(0,0,0,.4);

animation:popup .8s;

}

@keyframes popup{

from{

opacity:0;
transform:translateY(60px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.login-box h1{

text-align:center;
color:white;
margin-bottom:10px;

}

.login-box p{

text-align:center;
color:#ddd;
margin-bottom:30px;

}

.input-group{

margin-bottom:20px;
position:relative;

}

.input-group input{

width:100%;
padding:15px;
padding-left:45px;

border:none;
outline:none;

border-radius:12px;

font-size:16px;

}

.input-group i{

position:absolute;

left:15px;
top:17px;

color:#555;

}

#toggle{

position:absolute;

right:15px;

left:auto;

cursor:pointer;

}

.options{

display:flex;

justify-content:space-between;

font-size:14px;

color:white;

margin-bottom:20px;

}

.options a{

color:#00d9ff;

text-decoration:none;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:50px;

font-size:17px;

font-weight:bold;

cursor:pointer;

background:#00d9ff;

transition:.3s;

}

button:hover{

transform:translateY(-4px);

background:white;

}

.back{

margin-top:20px;

text-align:center;

}

.back a{

text-decoration:none;

color:white;

}

#error{

margin-top:20px;

text-align:center;

color:#ffb3b3;

font-weight:bold;

}

</style>

</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>

<div class="login-box">

<h1>

<i class="fa-solid fa-user-shield"></i>

Admin Login

</h1>

<p>

Bus Booking Management System

</p>

<form action="/login" method="POST">

<div class="input-group">

<i class="fa-solid fa-user"></i>

<input
type="text"
name="username"
placeholder="Username"
required>

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
name="password"
id="password"
placeholder="Password"
required>

<i
class="fa-solid fa-eye"
id="toggle"></i>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">

Forgot Password?

</a>

</div>

<button type="submit">

LOGIN

</button>

<div id="error">

{{message}}

</div>

</form>

<div class="back">

<a href="/">

← Back to Home

</a>

</div>

</div>

<script>

const toggle=document.getElementById("toggle");

const pass=document.getElementById("password");

toggle.onclick=function(){

if(pass.type==="password"){

pass.type="text";

toggle.classList.remove("fa-eye");

toggle.classList.add("fa-eye-slash");

}

else{

pass.type="password";

toggle.classList.remove("fa-eye-slash");

toggle.classList.add("fa-eye");

}

}

</script>

</body>

</html>
